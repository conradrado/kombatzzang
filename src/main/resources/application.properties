spring.application.name=matzzang
spring.profiles.active=local

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# flyway ??

# ????? true?? ???? ?? ?? true
spring.flyway.enabled=true

# DB ?? ??? flyway? ??? ?? true, ??? false
spring.flyway.baseline-on-migrate=false

# DB SCHEMA? ?? ??? ??(src/main/resources/schema)
spring.flyway.locations=classpath:schema

# migrate ? ??? ??
spring.flyway.validate-on-migrate=true

# JWT Access/Refresh Token 만료 시간 (ms)
jwt.access-token-expiration-ms=1800000
jwt.refresh-token-expiration-ms=1209600000

# 시작 시 생성할 ADMIN 계정. email/password가 비어 있으면 생성하지 않는다.
admin.email=${ADMIN_EMAIL:}
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:}

