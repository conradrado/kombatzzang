[limits]
max_iterations = 5
max_replans = 1
max_total_cost_usd = 1.0
max_cost_per_call_usd = 1.0
agent_timeout_sec = 900
verify_timeout_sec = 900

[verify]
# 첫 항목은 저장소 루트의 래퍼 이름이며 OS에 맞게 gradlew / gradlew.bat 으로 해석된다.
command = ["gradlew", "test", "--console=plain"]
log_tail_chars = 6000

# frontend/ 가 바뀐 이슈에서만 실행한다. 첫 항목(npm)은 OS에 맞게 해석된다.
[verify.frontend]
enabled = true
dir = "frontend"
install = ["npm", "install", "--no-audit", "--no-fund"]   # package-lock.json 이 없어 ci 대신 install
test = ["npm", "test", "--", "--run"]
install_timeout_sec = 600
test_timeout_sec = 600
# Node 25+ 내장 localStorage 가 jsdom 것을 가려 테스트가 깨지는 것을 막는다. Node 22 이하는 이 옵션을 몰라 오류가 나므로 비운다.
node_options = "--no-experimental-webstorage"
npm_cache = ""   # 병렬 실행 시 worktree 들이 공유할 npm 캐시 경로. 비우면 npm 기본값

[git]
protected_branches = ["main", "dev"]
base_branch = "dev"          # 새 브랜치를 따 오는 기준 브랜치


# #env:HARNESS_ASSIGNEE = "담당자"
assignee_env = "HARNESS_ASSIGNEE"   # 새 이슈 담당자를 읽을 환경변수 이름. 값이 없으면 담당자 없이 등록한다.

# 역할별 모델. claude --model 에 그대로 전달되므로 별칭(opus, sonnet, haiku) 또는 전체 모델 ID 를 쓴다.
# 빈 문자열이면 claude CLI 기본 모델을 사용한다.
[models]
router = "sonnet"
committer = "sonnet"
pr_writer = "sonnet"
planner = "opus"
generator = "sonnet"
resolver = "sonnet"
evaluator = "opus"
